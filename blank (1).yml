name: DragonEngine FINAL Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Puts Gradle 8.2 on PATH (the same version as the project wrapper) and caches dependencies.
      # It is used only when the repository has no usable ./gradlew.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      # If the project was uploaded as a .zip file, unpack it first.
      - name: Unpack project zip (only if no Gradle project is visible)
        run: |
          has_project() { find . -maxdepth 10 \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' | head -n 1; }
          if [ -z "$(has_project)" ]; then
            find . -maxdepth 3 -name '*.zip' -not -path './.git/*' -print0 | while IFS= read -r -d '' z; do
              echo "Unpacking: $z"
              d="${z%.zip}_unpacked"
              mkdir -p "$d"
              unzip -q -o "$z" -d "$d" || echo "could not unpack $z"
            done
          fi

      # Finds the Gradle project at any depth (repository root or inside folders).
      - name: Locate Gradle project
        id: loc
        run: |
          S=$(find . -maxdepth 10 \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' | head -n 1)
          if [ -z "$S" ]; then
            echo "settings.gradle not found. Files in the repository:"
            find . -maxdepth 4 -not -path './.git/*' | head -n 120
            exit 1
          fi
          D=$(dirname "$S")
          echo "Project directory: $D"
          ls -la "$D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      # Maven Central sometimes answers 429 (Too Many Requests) on shared CI addresses.
      # Retry with a growing pause instead of failing the whole job.
      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            CMD="./gradlew"
          else
            echo "gradlew or wrapper jar missing, using Gradle from PATH"
            CMD="gradle"
          fi
          for i in 1 2 3 4; do
            $CMD assembleDebug --no-daemon --stacktrace && exit 0
            echo "Attempt $i failed, retrying in $((i*45)) seconds"
            sleep $((i*45))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: DragonEngine-APK
          path: |
            ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.loc.outputs.dir }}/app/build/intermediates/cxx/Debug/*/obj/local/arm64-v8a/libCrash.so
            ${{ steps.loc.outputs.dir }}/app/src/main/jni/prebuilt/arm64-v8a/libHwMods.so
          if-no-files-found: warn
